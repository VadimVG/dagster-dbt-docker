apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: {{ .Values.flower.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5555
          env:
            - name: FLOWER_PORT
              value: "5555"
          envFrom:
            - secretRef:
                name: celery-credentials
          readinessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}