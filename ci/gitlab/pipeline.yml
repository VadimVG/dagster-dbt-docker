# GitLab CI/CD pipeline of the dagster-dbt project.
# Loaded from the root .gitlab-ci.yml. See ci/gitlab/README.md.
#
# lint     -> ruff, helm (in parallel)
# validate -> dbt-parse, dagster-definitions (in parallel)
# build    -> build-dagster-user-code, build-dbt-docs (only on main and tags vX.Y.Z)
# scan     -> trivy-dagster-user-code, trivy-dbt-docs (only on main and tags vX.Y.Z)

stages:
  - lint
  - validate
  - build
  - scan

variables:
  PYTHON_IMAGE: python:3.11          # same as in ci/docker/Dockerfile
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"  # GitLab caches only paths inside the project
  CHART: ci/k8s/dagster-dbt-chart

# ---------- templates ----------

# Jobs that work with the images: only on main and on release tags vX.Y.Z.
.release-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Python jobs with the project dependencies.
# pip downloads are cached until requirements.txt changes.
.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - ci/docker/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - pip install -r ci/docker/requirements.txt

# Image build with docker-in-docker, push to the GitLab Container Registry.
# main       -> tags <short sha> and main
# tag vX.Y.Z -> tag vX.Y.Z
.docker-build:
  extends: .release-rules
  stage: build
  image: docker:29.9.0
  services:
    - docker:29.9.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="-t $IMAGE:$CI_COMMIT_TAG"
      else
        TAG_ARGS="-t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:main"
      fi
    # The build context is the repository root, like in ci/docker.
    # $TAG_ARGS has no quotes on purpose: the shell must split it into arguments.
    - docker build --cache-from "$IMAGE:main" --build-arg BUILDKIT_INLINE_CACHE=1 -f "$DOCKERFILE" $TAG_ARGS .
    - docker push --all-tags "$IMAGE"

# Vulnerability scan of an image from the Container Registry.
# Soft mode: findings make the job orange (allow_failure), the pipeline stays green.
.trivy-scan:
  extends: .release-rules
  stage: scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]   # the image starts trivy by default, GitLab needs a shell
  allow_failure: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"      # Trivy pulls the image from the registry itself
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: trivy-db
    paths:
      - .cache/trivy
  script:
    # The same tag the build pushed: vX.Y.Z on a release, <short sha> on main
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
        "$CI_REGISTRY_IMAGE/$IMAGE_NAME:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

# ---------- lint ----------

ruff:
  stage: lint
  image: $PYTHON_IMAGE
  script:
    - pip install ruff==0.16.10
    # Soft mode: syntax errors, bad comparisons, return/break outside place, undefined names
    - ruff check app/ --select E9,F63,F7,F82

helm:
  stage: lint
  image:
    name: alpine/helm:3.22.0
    entrypoint: [""]   # the image starts helm by default, GitLab needs a shell
  script:
    - helm lint "$CHART"
    - helm lint "$CHART" -f "$CHART/values-dev.yaml"

# ---------- validate ----------

dbt-parse:
  extends: .python
  stage: validate
  variables:
    # dbt parse does not connect to the DWH, but profiles.yml needs these vars
    DWH_HOST: localhost
    DWH_PORT: "5432"
    DWH_USER: ci
    DWH_PASSWORD: ci
    DWH_DB: ci
  script:
    - cd app/dbt/projects
    - dbt parse --profiles-dir .

dagster-definitions:
  extends: .python
  stage: validate
  variables:
    # Empty instance, not app/dagster_home: that one needs the Dagster Postgres
    DAGSTER_HOME: /tmp/dagster_home
  script:
    - mkdir -p "$DAGSTER_HOME"
    - cd app
    - dagster definitions validate -m dagster_easy.definitions

# ---------- build ----------

build-dagster-user-code:
  extends: .docker-build
  variables:
    IMAGE_NAME: dagster-user-code
    DOCKERFILE: ci/docker/Dockerfile

build-dbt-docs:
  extends: .docker-build
  variables:
    IMAGE_NAME: dbt-docs-image
    DOCKERFILE: ci/docker/Dockerfile.dbt

# ---------- scan ----------

trivy-dagster-user-code:
  extends: .trivy-scan
  variables:
    IMAGE_NAME: dagster-user-code

trivy-dbt-docs:
  extends: .trivy-scan
  variables:
    IMAGE_NAME: dbt-docs-image
